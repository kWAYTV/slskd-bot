services:
  slskd-importer:
    image: ghcr.io/kwaytv/slskd-bot:latest
    build: .
    container_name: slskd_importer
    restart: unless-stopped
    command: ["python", "-m", "slskd_importer", "run"]

    environment:
      # Telegram Bot (required)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_LIBRARY_USERS: ${TELEGRAM_LIBRARY_USERS:-}

      # Spotify API (required)
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

      # slskd Connection (required)
      SLSKD_HOST: ${SLSKD_HOST}
      SLSKD_API_KEY: ${SLSKD_API_KEY}

      # Optional: self-hosted Bot API server for 2000MB uploads
      # (start it with: docker compose --profile local-api up -d)
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}

      # Paths (container paths)
      DOWNLOAD_DIR: /downloads
      OUTPUT_DIR: /music
      DATA_DIR: /data

      # Download Behavior
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-3}
      APPROVAL_TTL_SECS: ${APPROVAL_TTL_SECS:-86400}
      MAX_RESULTS: ${MAX_RESULTS:-5}
      DURATION_TOLERANCE_SECS: ${DURATION_TOLERANCE_SECS:-5}
      SEARCH_TIMEOUT_SECS: ${SEARCH_TIMEOUT_SECS:-30}
      DOWNLOAD_TIMEOUT_SECS: ${DOWNLOAD_TIMEOUT_SECS:-600}
      EXCLUDE_KEYWORDS: ${EXCLUDE_KEYWORDS:-live,remix,acoustic,karaoke,instrumental,cover,demo,radio edit,tribute,remaster}
      FILENAME_TEMPLATE: ${FILENAME_TEMPLATE:-{artist} - {title}}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # Mount slskd completed downloads directory (read-only).
      # Adjust the host path to match your slskd downloads location.
      # With a read-only mount, originals are deleted through slskd's API after
      # saving — enable SLSKD_REMOTE_FILE_MANAGEMENT=true on the slskd container.
      - ${SLSKD_DOWNLOAD_PATH:-./downloads}:/downloads:ro

      # Mount output music directory (read-write)
      # This is where renamed FLAC files are placed
      - ${MUSIC_OUTPUT_PATH:-./music}:/music

      # Persistent data (SQLite database for history + imports)
      - ${DATA_PATH:-./data}:/data

    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Optional: self-hosted Telegram Bot API server. Lifts the bot upload limit
  # from 50 MB (cloud) to 2000 MB so originals are sent instead of OGG previews.
  # Requires TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org
  # and TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081 on the bot.
  # Start with: docker compose --profile local-api up -d
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "true"
    volumes:
      - ${BOT_API_DATA_PATH:-./telegram-bot-api}:/var/lib/telegram-bot-api
      # Must see the music tree at the same path as the bot container so
      # local-mode file handoff works without re-uploading.
      - ${MUSIC_OUTPUT_PATH:-./music}:/music:ro
      - ${SLSKD_DOWNLOAD_PATH:-./downloads}:/downloads:ro
